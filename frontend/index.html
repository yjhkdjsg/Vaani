<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaani - AI Assistant</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Vaani</h1>
            <p>AI Agricultural Assistant</p>
        </header>

        <div class="chat-container">
            <div id="chatMessages" class="chat-messages">
                <div class="message bot-message">
                    <div class="message-content">
                        <strong>Vaani:</strong> Namaste! Main Vaani hoon. Main aapki kaise madad kar sakti hoon?
                    </div>
                </div>
            </div>

            <div class="input-container">
                <div class="input-row">
                    <button id="recordButton" class="voice-btn">Mic</button>
                    <input
                        type="text"
                        id="messageInput"
                        placeholder="Type your question here..."
                        autocomplete="off"
                    >
                    <button id="sendButton" class="send-btn">Send</button>
                </div>

                <div class="voice-status" id="recordingStatus" style="display: none;">
                    <span style="color: #dc3545; font-weight: bold;">Recording...</span>
                </div>
            </div>

            <div id="loading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Getting response...</p>
            </div>

            <div id="error" class="error" style="display: none;"></div>
        </div>

        <footer>
            <p>Powered by AWS Bedrock, Transcribe &amp; Polly</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
